spring.application.name=restful-web-services
#spring.mvc.apiversion.use.path-segment=0
#spring.mvc.apiversion.use.query-parameter=version
#spring.mvc.apiversion.use.header=X-API-VERSION

#Accept: application/json;version=1
#spring.mvc.apiversion.use.media-type-parameter[application/json]=version
logging.level.org.springframework=info
management.endpoints.web.exposure.include=*

#Enabling h2 sql console
spring.h2.console.enabled=true
#Set static url
spring.datasource.url=jdbc:h2:mem:test-db
spring.jpa.defer-datasource-initialization=true